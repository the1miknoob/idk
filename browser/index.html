<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Browser</title>
  <meta name="description" content="A web browser inside the site, with tabs, bookmarks and history. Pages load through a proxy server.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='9'/><path d='M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z'/></svg>">
  <style>
    /* ---------- colors (light, then dark) ---------- */
    :root {
      --accent: #2563eb;
      --accent-soft: color-mix(in srgb, var(--accent) 14%, transparent);
      --on-accent: #fff;
      --strip: #e8ebf0; --bar: #ffffff; --field: #eef1f5; --page: #f7f8fa; --panel: #ffffff;
      --text: #1d2129; --muted: #656d79; --line: #dde1e7; --hover: rgba(15, 23, 42, .06); --press: rgba(15, 23, 42, .1);
      --good: #16a34a; --warn: #d97706; --bad: #dc2626;
      --shadow: 0 10px 30px rgba(15, 23, 42, .14), 0 2px 6px rgba(15, 23, 42, .06);
      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --r: 10px; --h: 40px; --tab-h: 36px;
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --strip: #121418; --bar: #1d2026; --field: #2a2e36; --page: #16181d; --panel: #1f2228;
      --text: #e8eaee; --muted: #9ba3ae; --line: #30343c; --hover: rgba(255, 255, 255, .07); --press: rgba(255, 255, 255, .12);
      --shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
      color-scheme: dark;
    }
    :root[data-density="compact"] { --h: 34px; --tab-h: 31px; }
    :root[data-font="site"] { --font: "Space Grotesk", system-ui, sans-serif; }
    :root[data-font="serif"] { --font: Georgia, "Iowan Old Style", "Times New Roman", serif; }
    :root[data-font="mono"] { --font: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

    [hidden] { display: none !important; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { overflow: hidden; background: var(--page); color: var(--text); font: 14px/1.4 var(--font); -webkit-font-smoothing: antialiased; }
    button, input, select { font: inherit; color: inherit; }
    a { color: var(--accent); }
    .site-home { display: none !important; }   /* the Browser has its own home button */
    .i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; display: block; }
    .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

    /* ---------- tab strip ---------- */
    .chrome { flex: none; position: relative; z-index: 20; background: var(--strip); padding-top: env(safe-area-inset-top); }
    .strip { display: flex; align-items: flex-end; gap: 2px; padding: 6px 6px 0; min-width: 0; }
    .tabs { display: flex; gap: 1px; overflow-x: auto; min-width: 0; scrollbar-width: none; flex: 0 1 auto; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      display: flex; align-items: center; gap: 8px; flex: 0 0 auto; width: 220px; max-width: 46vw; min-width: 0; height: var(--tab-h);
      padding: 0 6px 0 12px; border-radius: 9px 9px 0 0; cursor: default; color: var(--muted); position: relative; user-select: none; -webkit-user-select: none;
    }
    .tab:not(.on):hover { background: var(--hover); }
    .tab:not(.on) + .tab:not(.on)::before { content: ""; position: absolute; left: -1px; top: 9px; bottom: 9px; width: 1px; background: var(--line); }
    .tab.on { background: var(--bar); color: var(--text); }
    .tab .fav { width: 16px; height: 16px; flex: none; display: grid; place-items: center; }
    .tab .fav img { width: 16px; height: 16px; object-fit: contain; border-radius: 3px; }
    .tab .fav .i { width: 15px; height: 15px; }
    .mono { display: grid; place-items: center; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 600; text-transform: uppercase; }
    .tab .mono { width: 16px; height: 16px; font-size: 10px; }
    .tab .tt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
    .tab .x { flex: none; width: 22px; height: 22px; border: 0; border-radius: 50%; background: none; display: grid; place-items: center; color: var(--muted); opacity: .8; }
    .tab .x .i { width: 13px; height: 13px; stroke-width: 2.2; }
    .tab .x:hover { background: var(--press); color: var(--text); opacity: 1; }
    .spin { width: 13px; height: 13px; border: 2px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* pill tabs */
    :root[data-tabs="pills"] .strip { align-items: center; padding: 6px; }
    :root[data-tabs="pills"] .tabs { gap: 4px; }
    :root[data-tabs="pills"] .tab { border-radius: 999px; height: calc(var(--tab-h) - 4px); }
    :root[data-tabs="pills"] .tab.on { box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    :root[data-tabs="pills"] .tab::before { display: none; }

    .ib { flex: none; width: var(--h); height: var(--h); border: 0; border-radius: 50%; background: none; display: grid; place-items: center; color: var(--text); text-decoration: none; }
    .ib:hover:not(:disabled) { background: var(--hover); }
    .ib:active:not(:disabled) { background: var(--press); }
    .ib:disabled { opacity: .35; }
    .strip .ib { width: 32px; height: 32px; margin-bottom: 2px; color: var(--muted); }
    :root[data-tabs="pills"] .strip .ib { margin-bottom: 0; }
    .strip .ib:hover { color: var(--text); }

    /* ---------- toolbar ---------- */
    .toolbar { display: flex; align-items: center; gap: 2px; padding: 4px 6px; background: var(--bar); border-bottom: 1px solid var(--line); }
    :root[data-tabs="pills"] .toolbar { border-top: 1px solid var(--line); }
    .toolbar .ib { width: calc(var(--h) - 4px); height: calc(var(--h) - 4px); }
    .addr { position: relative; flex: 1; min-width: 0; margin: 0 4px; }
    .addr form { display: flex; align-items: center; gap: 6px; height: calc(var(--h) - 4px); padding: 0 4px 0 12px; border-radius: 999px; background: var(--field); border: 1.5px solid transparent; }
    .addr form:hover { background: color-mix(in srgb, var(--field) 80%, var(--text) 4%); }
    .addr form:focus-within { border-color: var(--accent); background: var(--bar); }
    .lock { flex: none; color: var(--muted); display: grid; place-items: center; }
    .lock .i { width: 15px; height: 15px; }
    .lock[data-state="insecure"] { color: var(--warn); }
    .addr input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: 14px; padding: 0 2px; }
    .addr input::placeholder { color: var(--muted); }
    .star { width: 28px !important; height: 28px !important; color: var(--muted) !important; }
    .star .i { width: 16px; height: 16px; }
    .star.on { color: var(--accent) !important; }
    .star.on .i { fill: currentColor; }
    #shield { position: relative; }
    #shield::after { content: ""; position: absolute; right: 7px; bottom: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 2px var(--bar); }
    #shield[data-state="ok"]::after { background: var(--good); }
    #shield[data-state="bad"]::after { background: var(--bad); }
    .sugg { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; z-index: 40; }
    .sugg button { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 8px 10px; border: 0; border-radius: 8px; background: none; min-width: 0; }
    .sugg button .i { width: 16px; height: 16px; color: var(--muted); }
    .sugg button.on, .sugg button:hover { background: var(--hover); }
    .sugg b { font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sugg small { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; pointer-events: none; }
    .progress i { position: absolute; top: 0; bottom: 0; width: 30%; background: var(--accent); animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { left: -30%; } to { left: 100%; } }

    /* bookmarks bar */
    /* the YouTube helper bar */
    .vbar { display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 12px; background: var(--bar); border-bottom: 1px solid var(--line); font-size: 12.5px; min-height: 36px; }
    .vbar.warn { background: color-mix(in srgb, #f59e0b 14%, var(--bar)); }
    .vb-body { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1; min-width: 0; }
    .vb-ic { display: inline-flex; color: var(--accent); }
    .vbar.warn .vb-ic { color: #d97706; }
    .vb-ic svg { width: 16px; height: 16px; }
    .vb-text { color: var(--text); }
    .vb-btns { display: inline-flex; gap: 6px; flex-wrap: wrap; }
    .vb-b { border: 1px solid var(--line); background: var(--bg, transparent); color: var(--text); border-radius: 999px; padding: 3px 11px; font-size: 12.5px; }
    .vb-b:hover { background: var(--hover); }
    .vb-b.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .vb-x { flex: none; width: 26px; height: 26px; border: 0; background: none; border-radius: 6px; color: var(--muted, inherit); font-size: 16px; line-height: 1; }
    .vb-x::before { content: "×"; }
    .vb-x:hover { background: var(--hover); }
    .bmbar { display: flex; align-items: center; gap: 2px; padding: 3px 8px; background: var(--bar); border-bottom: 1px solid var(--line); overflow: hidden; min-height: 32px; }
    .bmbar button { display: flex; align-items: center; gap: 7px; max-width: 170px; flex: none; border: 0; background: none; border-radius: 999px; padding: 4px 10px 4px 7px; font-size: 12.5px; color: var(--text); }
    .bmbar button:hover { background: var(--hover); }
    .bmbar button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bmbar img, .bmbar .mono { width: 16px; height: 16px; flex: none; border-radius: 3px; font-size: 9.5px; }
    .bmbar .empty { color: var(--muted); font-size: 12.5px; padding: 0 6px; }
    .bmbar .all { margin-left: auto; color: var(--muted); }

    /* menu */
    .menu { position: absolute; right: 8px; top: calc(100% - 2px); width: 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; z-index: 50; }
    .menu button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: none; text-align: left; }
    .menu button:hover { background: var(--hover); }
    .menu button .i { width: 17px; height: 17px; color: var(--muted); }
    .menu kbd { margin-left: auto; font: 11.5px var(--font); color: var(--muted); }
    .menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 2px; }
    .menu .zoom { display: flex; align-items: center; gap: 4px; padding: 3px 4px 3px 10px; }
    .menu .zoom > .i { width: 17px; height: 17px; color: var(--muted); margin-right: 8px; }
    .menu .zoom span { flex: 1; }
    .menu .zoom button { width: 30px; height: 30px; padding: 0; justify-content: center; border-radius: 6px; }
    .menu .zoom output { width: 44px; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); }

    /* ---------- page area ---------- */
    .view { flex: 1; position: relative; min-height: 0; background: #fff; }
    .view.ntp-on { background: var(--page); }
    .frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; transform-origin: 0 0; }

    /* new tab page */
    .ntp { position: absolute; inset: 0; overflow-y: auto; background: var(--page) center / cover no-repeat; padding: 0 16px 70px; }
    .ntp-in { max-width: 720px; margin: 0 auto; padding-top: clamp(32px, 12vh, 120px); display: flex; flex-direction: column; align-items: center; }
    .clock { font-size: clamp(44px, 9vw, 68px); font-weight: 300; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
    .date { color: var(--muted); margin: 8px 0 0; font-size: 15px; }
    .ntp-search { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 580px; height: 48px; margin-top: 28px; padding: 0 18px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(0,0,0,.05); }
    .ntp-search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .ntp-search .i { color: var(--muted); }
    .ntp-search input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: 16px; }
    .ntp-search input::placeholder { color: var(--muted); }
    .quick { display: grid; grid-template-columns: repeat(auto-fill, 92px); justify-content: center; gap: 6px; width: 100%; max-width: 700px; margin-top: 30px; }
    .q { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px 8px; border-radius: 12px; border: 0; background: none; min-width: 0; color: var(--text); }
    .q:hover { background: var(--hover); }
    .q .ic { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
    .q .ic img { width: 24px; height: 24px; object-fit: contain; }
    .q .ic .mono { width: 100%; height: 100%; font-size: 17px; background: none; }
    .q .ic.add { color: var(--muted); }
    .q span.n { font-size: 12.5px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .q .del { position: absolute; top: 4px; right: 12px; width: 20px; height: 20px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); display: none; place-items: center; color: var(--muted); }
    .q .del .i { width: 11px; height: 11px; stroke-width: 2.4; }
    .quick.edit .q .del { display: grid; }
    .qtools { display: flex; justify-content: center; gap: 4px; margin-top: 4px; }
    .qtools button, .linkbtn { border: 0; background: none; color: var(--muted); font-size: 12.5px; padding: 5px 10px; border-radius: 999px; }
    .qtools button:hover, .linkbtn:hover { background: var(--hover); color: var(--text); }
    .addq { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 8px; width: 100%; max-width: 520px; }
    .addq input { flex: 1 1 150px; min-width: 0; height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); outline: none; }
    .addq input:focus { border-color: var(--accent); }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; width: 100%; margin-top: 40px; }
    .cols h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 6px 10px; letter-spacing: .02em; }
    .links { display: grid; gap: 1px; }
    .link { display: flex; align-items: center; gap: 12px; padding: 7px 10px; border-radius: 8px; border: 0; background: none; text-align: left; min-width: 0; width: 100%; }
    .link:hover { background: var(--hover); }
    .link img, .link .mono { width: 18px; height: 18px; flex: none; border-radius: 4px; font-size: 10px; }
    .link .lt { min-width: 0; flex: 1; display: flex; gap: 8px; align-items: baseline; }
    .link b { font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .link small { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 45%; font-size: 12px; }
    .link .rm { flex: none; width: 26px; height: 26px; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; color: var(--muted); visibility: hidden; }
    .link .rm .i { width: 13px; height: 13px; }
    .link:hover .rm, .link:focus-within .rm { visibility: visible; }
    .link .rm:hover { background: var(--press); color: var(--text); }
    .empty { color: var(--muted); font-size: 13px; padding: 6px 10px; }
    .ntp-foot { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: center; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); pointer-events: none; }
    .ntp-foot > * { pointer-events: auto; }
    .status, .customize { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }
    .status:hover, .customize:hover { color: var(--text); }
    .customize .i { width: 15px; height: 15px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none; }
    .dot.ok { background: var(--good); } .dot.bad { background: var(--bad); }
    /* a background picture or color on the new tab page */
    .ntp.dark-bg .clock, .ntp.dark-bg .date, .ntp.dark-bg .q, .ntp.dark-bg .cols h2, .ntp.dark-bg .qtools button { color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.35); }
    .ntp.has-bg .q:hover { background: rgba(255,255,255,.18); }
    .ntp.has-bg .cols > div { background: color-mix(in srgb, var(--panel) 88%, transparent); border-radius: 12px; padding: 10px 6px; backdrop-filter: blur(10px); }
    .ntp.dark-bg .cols h2 { text-shadow: none; color: var(--muted); }

    /* error */
    .err { position: absolute; inset: 0; overflow-y: auto; background: var(--page); display: grid; place-items: center; padding: 24px 16px; z-index: 5; }
    .err-in { max-width: 500px; width: 100%; }
    .err-ic { width: 44px; height: 44px; color: var(--muted); }
    .err-ic .i { width: 44px; height: 44px; stroke-width: 1.5; }
    .err h2 { font-size: 22px; font-weight: 600; margin: 18px 0 8px; }
    .err p { color: var(--muted); line-height: 1.55; margin: 0; }
    .err .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
    .err details { margin-top: 22px; font-size: 12.5px; color: var(--muted); }
    .err summary { cursor: pointer; }
    .err pre { white-space: pre-wrap; word-break: break-word; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; max-height: 180px; overflow: auto; font-size: 12px; }
    .btn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-weight: 500; font-size: 13.5px; }
    .btn:hover { background: var(--hover); }
    .btn:disabled { opacity: .6; }
    .btn .i { width: 15px; height: 15px; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }

    /* ---------- side panel: bookmarks, history, settings ---------- */
    .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.28); z-index: 60; }
    .sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); background: var(--panel); border-left: 1px solid var(--line); z-index: 61; display: flex; flex-direction: column; box-shadow: var(--shadow); padding-top: env(safe-area-inset-top); }
    .sheet header { display: flex; align-items: center; gap: 4px; padding: 10px 8px 10px 12px; border-bottom: 1px solid var(--line); }
    .stabs { display: flex; gap: 2px; flex: 1; min-width: 0; }
    .stabs button { display: flex; align-items: center; gap: 7px; border: 0; background: none; padding: 7px 11px; border-radius: 8px; color: var(--muted); white-space: nowrap; }
    .stabs button .i { width: 16px; height: 16px; }
    .stabs button:hover { background: var(--hover); color: var(--text); }
    .stabs button.on { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
    .sheet .body { flex: 1; overflow-y: auto; padding: 6px 16px 40px; }
    .sheet h3 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 24px 0 8px; letter-spacing: .02em; }
    .sheet p { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0 0 10px; }
    .set { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 6px 0; border-bottom: 1px solid var(--line); }
    .set:last-child { border-bottom: 0; }
    .set > label, .set > .lab { flex: 1; min-width: 0; }
    .set small { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
    .group { border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; }
    .seg { display: inline-flex; background: var(--field); border-radius: 8px; padding: 2px; flex: none; }
    .seg button { border: 0; background: none; padding: 5px 11px; border-radius: 6px; font-size: 13px; color: var(--muted); }
    .seg button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
    .sw { position: relative; width: 36px; height: 20px; flex: none; }
    .sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
    .sw span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .15s; }
    .sw span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
    .sw input:checked + span { background: var(--accent); }
    .sw input:checked + span::after { transform: translateX(16px); }
    .sw input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
    .swatches { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 0; }
    .swatch { width: 26px; height: 26px; border-radius: 50%; border: 0; padding: 0; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); position: relative; }
    .swatch.on::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--c); }
    .swatch.custom { background: conic-gradient(#f43f5e, #f59e0b, #22c55e, #06b6d4, #6366f1, #d946ef, #f43f5e); overflow: hidden; }
    .swatch.custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .bgs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 10px 0; }
    .bgopt { aspect-ratio: 16 / 10; border-radius: 8px; border: 1px solid var(--line); background: var(--b) center / cover; position: relative; font-size: 11.5px; color: var(--muted); display: grid; place-items: end start; padding: 4px 6px; }
    .bgopt.on { outline: 2px solid var(--accent); outline-offset: 2px; }
    .bgopt.light span { color: #333; } .bgopt.darkb span { color: #fff; }
    .sheet select, .sheet .field { width: 100%; height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); outline: none; }
    .sheet .field:focus, .sheet select:focus { border-color: var(--accent); }
    .sheet .row { display: flex; flex-wrap: wrap; gap: 8px; }
    .srv { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
    .srv:last-child { border-bottom: 0; }
    .srv input[type=radio] { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; flex: none; }
    .srv .ot { flex: 1; min-width: 0; }
    .srv b { font-weight: 500; display: block; }
    .srv small { color: var(--muted); display: block; font-size: 11.5px; word-break: break-all; }
    .srv .pg { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .srv .pg[data-r="ok"] { color: var(--good); } .srv .pg[data-r="bad"] { color: var(--bad); } .srv .pg[data-r="warn"] { color: var(--warn); }
    .srv .field { margin-top: 6px; height: 32px; }
    .now { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 4px 0 10px; }
    .sheet .search { width: 100%; height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--field); margin: 12px 0 6px; outline: none; }
    .sheet .day { font-size: 12px; color: var(--muted); margin: 14px 10px 4px; font-weight: 600; }
    .keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 13px; color: var(--muted); align-items: center; }
    kbd { font: 11.5px var(--font); background: var(--field); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; color: var(--text); }

    .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: #1f2329; color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 90; max-width: calc(100vw - 32px); }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    :root[data-theme="dark"] .toast { background: #e8eaee; color: #16181d; }

    @media (max-width: 640px) {
      .tab { width: 150px; }
      .toolbar { padding: 4px; }
      .hide-sm { display: none !important; }
      .cols { grid-template-columns: 1fr; }
      .addr input { font-size: 16px; }   /* stops iPhones zooming in */
      .menu { left: 8px; right: 8px; width: auto; }
      .menu kbd { display: none; }
      .quick { grid-template-columns: repeat(4, 1fr); }
      .ntp { padding-bottom: 20px; }
      .ntp-foot { position: static; padding: 28px 0 0; }
    }
  </style>
</head>
<body data-no-slash>
  <div class="app">
    <header class="chrome">
      <div class="strip">
        <a class="ib" id="home" href="../" title="Back to Mikaeel's site" aria-label="Back to Mikaeel's site" data-icon="home"></a>
        <div class="tabs" id="tabs" role="tablist" aria-label="Tabs"></div>
        <button class="ib" id="newtab" title="New tab (Alt+T)" aria-label="New tab" data-icon="plus"></button>
      </div>
      <div class="toolbar">
        <button class="ib" id="back" title="Back (Alt+←)" aria-label="Back" data-icon="back"></button>
        <button class="ib hide-sm" id="fwd" title="Forward (Alt+→)" aria-label="Forward" data-icon="forward"></button>
        <button class="ib" id="reload" title="Reload (Alt+R)" aria-label="Reload" data-icon="reload"></button>
        <div class="addr">
          <form id="addr-form" autocomplete="off">
            <span class="lock" id="lock" title="Search or type a web address"></span>
            <input id="addr" type="text" inputmode="url" enterkeyhint="go" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="Search or type a web address" aria-label="Address and search bar" aria-autocomplete="list" aria-controls="sugg">
            <button type="button" class="ib star" id="star" title="Bookmark this page (Alt+D)" aria-label="Bookmark this page" data-icon="star"></button>
          </form>
          <div class="sugg" id="sugg" role="listbox" hidden></div>
        </div>
        <button class="ib hide-sm" id="shield" title="Proxy" aria-label="Proxy status and settings" data-icon="shield"></button>
        <button class="ib hide-sm" id="bm-btn" title="Bookmarks" aria-label="Bookmarks" data-icon="bookmark"></button>
        <button class="ib" id="menu-btn" title="Menu" aria-label="Menu" aria-haspopup="menu" aria-expanded="false" data-icon="more"></button>
      </div>
      <nav class="bmbar" id="bmbar" aria-label="Bookmarks bar" hidden></nav>
      <div class="vbar" id="vbar" role="status" hidden><span class="vb-body" id="vbar-body"></span><button type="button" class="vb-x" data-v="hide" title="Hide this bar" aria-label="Hide this bar"></button></div>
      <div class="progress" id="progress" hidden><i></i></div>
      <div class="menu" id="menu" role="menu" hidden>
        <button data-act="newtab" role="menuitem"><span data-icon="plus"></span>New tab <kbd>Alt+T</kbd></button>
        <button data-act="reopen" role="menuitem"><span data-icon="undo"></span>Reopen closed tab <kbd>Alt+Shift+T</kbd></button>
        <button data-act="fwd" role="menuitem" class="fwd-sm"><span data-icon="forward"></span>Forward</button>
        <hr>
        <button data-act="bookmarks" role="menuitem"><span data-icon="bookmark"></span>Bookmarks</button>
        <button data-act="history" role="menuitem"><span data-icon="history"></span>History <kbd>Alt+H</kbd></button>
        <hr>
        <div class="zoom"><span data-icon="zoom"></span><span>Zoom</span><button data-act="zoom-" aria-label="Zoom out" data-icon="minus"></button><output id="zoom">100%</output><button data-act="zoom+" aria-label="Zoom in" data-icon="plus"></button></div>
        <button data-act="copy" role="menuitem"><span data-icon="link"></span>Copy link</button>
        <button data-act="direct" role="menuitem"><span data-icon="external"></span>Open without the proxy</button>
        <button data-act="full" role="menuitem"><span data-icon="full"></span>Full screen</button>
        <hr>
        <button data-act="customize" role="menuitem"><span data-icon="brush"></span>Customize</button>
        <button data-act="settings" role="menuitem"><span data-icon="settings"></span>Settings</button>
      </div>
    </header>

    <main class="view" id="view">
      <div class="frames" id="frames"></div>

      <section class="ntp" id="ntp">
        <div class="ntp-in">
          <div id="clockbox"><div class="clock" id="clock"></div><p class="date" id="date"></p></div>
          <form id="ntp-form" class="ntp-search" autocomplete="off">
            <span data-icon="search"></span>
            <input id="ntp-q" type="search" enterkeyhint="go" placeholder="Search or type a web address" aria-label="Search or type a web address">
          </form>
          <div id="quickbox" style="width:100%;display:flex;flex-direction:column;align-items:center">
            <div class="quick" id="quick"></div>
            <div class="qtools"><button id="q-edit">Edit shortcuts</button></div>
            <form class="addq" id="addq" hidden>
              <input id="addq-name" placeholder="Name" maxlength="30" aria-label="Shortcut name">
              <input id="addq-url" placeholder="Web address" aria-label="Shortcut web address">
              <button class="btn primary" type="submit">Add</button>
            </form>
          </div>
          <div class="cols" id="cols">
            <div><h2>Bookmarks</h2><div class="links" id="ntp-bm"></div></div>
            <div><h2>Recently visited</h2><div class="links" id="ntp-hist"></div></div>
          </div>
        </div>
        <div class="ntp-foot">
          <button class="status" id="status" type="button" title="Proxy settings"><span class="dot" id="status-dot"></span><span id="status-text">Starting the proxy…</span></button>
          <button class="customize" id="customize" type="button" title="Customize"><span data-icon="brush"></span><span>Customize</span></button>
        </div>
      </section>

      <section class="err" id="err" hidden>
        <div class="err-in">
          <div class="err-ic" id="err-icon"></div>
          <h2 id="err-h">This page couldn't be opened</h2>
          <p id="err-p"></p>
          <div class="row">
            <button class="btn primary" id="err-retry">Try again</button>
            <button class="btn" id="err-next">Try another server</button>
            <button class="btn" id="err-core">Try the other engine</button>
            <button class="btn" id="err-settings">Proxy settings</button>
            <button class="btn" id="err-direct">Open without the proxy</button>
          </div>
          <details><summary>Details</summary><pre id="err-trace"></pre></details>
        </div>
      </section>
    </main>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="sheet" id="sheet" hidden aria-label="Bookmarks, history and settings">
    <header>
      <div class="stabs" role="tablist">
        <button data-sheet="bookmarks"><span data-icon="bookmark"></span>Bookmarks</button>
        <button data-sheet="history"><span data-icon="history"></span>History</button>
        <button data-sheet="settings"><span data-icon="settings"></span>Settings</button>
      </div>
      <button class="ib" id="sheet-x" aria-label="Close" data-icon="x"></button>
    </header>
    <div class="body" id="sheet-body"></div>
  </aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // Apply the saved look before anything shows, so the page doesn't flash
    (function () {
      var p = {}; try { p = JSON.parse(localStorage.getItem('browser-prefs')) || {}; } catch (e) {}
      var r = document.documentElement, t = p.theme || 'auto', site = null;
      try { site = localStorage.getItem('theme'); } catch (e) {}
      if (t === 'auto') t = site || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      r.dataset.theme = t;
      if (p.accent) r.style.setProperty('--accent', p.accent);
      r.dataset.tabs = p.tabs || 'classic'; r.dataset.density = p.density || 'comfy'; r.dataset.font = p.font || 'system';
    })();
    // Browsers without SharedWorker (some phones): run the proxy's background worker as a normal worker instead (see baremux/shim.js)
    if (typeof SharedWorker === 'undefined' && typeof Worker !== 'undefined') (function () {
      var w = null;
      window.__bareShim = function (url, port) { w = w || new Worker(new URL('baremux/shim.js', location.href)); w.postMessage({ connect: 1 }, [port]); };
      window.SharedWorker = function (url) { var c = new MessageChannel(); window.__bareShim(url, c.port2); this.port = c.port1; };
    })();
  </script>
  <script src="uv/uv.bundle.js"></script>
  <script src="uv/uv.config.js"></script>
  <script src="baremux/index.js"></script>
  <script src="scramjet/scramjet.all.js"></script>
  <script src="../site.js" defer></script>
  <script src="browser.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games · Mikaeel</title>
  <meta name="description" content="Free browser games made by Mikaeel: puzzles, arcade games, word games and chess">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    header { padding: 28px 0 18px; }
    header h1 { font-size: clamp(34px, 6vw, 48px); line-height: 1.1; }
    header p { color: var(--muted); font-size: 18px; margin-top: 8px; }
    .filters { margin: 8px 0 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
    .game {
      display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
      overflow: hidden; color: var(--text); transition: transform .15s, border-color .15s, box-shadow .15s;
    }
    .game:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 14px 30px rgba(0,0,0,.12); }
    .art { height: 130px; display: grid; place-items: center; font-size: 64px; position: relative; }
    .art .emo { filter: drop-shadow(0 6px 10px rgba(0,0,0,.3)); transition: transform .2s; }
    .game:hover .art .emo { transform: scale(1.12) rotate(-4deg); }
    .badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
    .body { padding: 14px 16px 16px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .body h2 { font-size: 19px; }
    .body p { color: var(--muted); font-size: 14px; }
    .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 8px; }
    .pill { background: var(--surface-2); color: var(--muted); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 500; }
    .pill.best { background: var(--accent-soft); color: var(--accent); }
    .pill.live { background: #30a46c22; color: var(--good); }
    .empty { color: var(--muted); text-align: center; padding: 30px; }
  </style>
</head>
<body>
  <div class="wrap wide">
    <nav class="g-nav">
      <a href="../">← Back to Mikaeel's site</a>
      <div class="right"><button class="icon-btn" data-theme-toggle aria-label="Light or dark">🌙</button></div>
    </nav>
    <header>
      <h1>🎮 Games</h1>
      <p>Games I've built. They run right in your browser, work on phones, and save your best scores.</p>
    </header>
    <div class="seg filters" id="filters"></div>
    <main class="grid" id="grid"></main>
  </div>

  <script src="shared.js"></script>
  <script>
    // ✏️ EDIT: add a game here and it shows up on the page
    const GAMES = [
      { id: 'blockpop', href: 'block-pop/', emoji: '🧩', title: 'Block Pop', tags: ['Puzzle'], badge: '🔥 Trending',
        bg: 'linear-gradient(135deg,#3a4ad9,#8e6cff)', text: 'Drag blocks onto the board and clear rows and columns. Chain clears for big combos.' },
      { id: 'mergedrop', href: 'merge-drop/', emoji: '🪐', title: 'Merge Drop', tags: ['Puzzle', 'Arcade'], badge: '🔥 Trending',
        bg: 'linear-gradient(135deg,#141833,#5b2a86)', text: 'Drop planets, merge matching ones into bigger ones, and don\'t overflow. Fruit and animal themes too.' },
      { id: 'wordhunt', href: 'word-hunt/', emoji: '🔤', title: 'Word Hunt', tags: ['Word', 'Daily'], badge: '📅 Daily',
        bg: 'linear-gradient(135deg,#3fa45b,#d4a72c)', text: 'Guess the 5-letter word in 6 tries. A new puzzle every day, plus unlimited practice.', bestLabel: 'Streak' },
      { id: 'nightswarm', href: 'night-swarm/', emoji: '🌙', title: 'Night Swarm', tags: ['Arcade', 'Action'], badge: '🔥 Trending',
        bg: 'radial-gradient(circle at 50% 60%,#3b2a6b,#0d1410 70%)', text: 'Survive 10 minutes against an endless swarm. Level up, pick upgrades and face the Shadow King.', bestLabel: 'Best time', fmt: s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` },
      { id: 'skyhop', href: 'sky-hop/', emoji: '🎈', title: 'Sky Hop', tags: ['Arcade'],
        bg: 'linear-gradient(180deg,#6ec3ff,#ffd8a8)', text: 'Tap to fly Blip through the crystal pillars. Unlock new colors as you beat your best.' },
      { id: 'snake', href: 'snake/', emoji: '🐍', title: 'Snake', tags: ['Arcade'],
        bg: 'repeating-conic-gradient(#aad751 0 25%, #a2d149 0 50%) 0 0 / 40px 40px', text: 'The classic: eat apples, grow longer, don\'t bite yourself. Three speeds and a no-walls mode.', bestKey: 'snake-normal-walls' },
      { id: '2048', href: '2048/', emoji: '🔢', title: '2048', tags: ['Puzzle'],
        bg: 'linear-gradient(135deg,#edc22e,#f67c5f)', text: 'Slide tiles, merge matching numbers and reach 2048. Try 5×5 and 6×6 boards too.' },
      { id: 'reaction', href: 'reaction-lab/', emoji: '⚡', title: 'Reaction Lab', tags: ['Arcade', 'Brain'],
        bg: 'linear-gradient(135deg,#2b87d1,#4bdb6a)', text: 'Test your reaction time, aim and number memory. How do you compare to your friends?', bestLabel: 'Reaction', fmt: v => v + ' ms' },
      { id: 'chess', href: 'chess/', emoji: '♟️', title: 'Chess', tags: ['Strategy'],
        bg: 'conic-gradient(#769656 0 25%, #eeeed2 0 50%, #769656 0 75%, #eeeed2 0) 0 0 / 44px 44px', text: 'Play the computer on four levels or a friend. Hints, undo, and full game analysis.' },
    ];

    const tags = ['All', ...new Set(GAMES.flatMap(g => g.tags))];
    let filter = 'All';
    const read = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };

    function metaFor(g) {
      const out = [];
      if (g.id === 'chess') {
        const game = read('chess-game');
        if (game && game.moves && game.moves.length && !game.over) out.push(`<span class="pill live">▶ Game in progress</span>`);
        const st = read('chess-stats');
        const wins = st ? Object.values(st).reduce((s, x) => s + (x.w || 0), 0) : 0;
        if (wins) out.push(`<span class="pill best">🏆 ${wins} win${wins === 1 ? '' : 's'}</span>`);
      } else {
        const best = read('game-best-' + (g.bestKey || g.id));
        if (best) out.push(`<span class="pill best">🏆 ${g.bestLabel || 'Best'}: ${g.fmt ? g.fmt(best) : best}</span>`);
      }
      out.push(...g.tags.map(t => `<span class="pill">${t}</span>`));
      return out.join('');
    }

    function render() {
      $filters.innerHTML = tags.map(t => `<button data-t="${t}" class="${t === filter ? 'on' : ''}">${t}</button>`).join('');
      const list = GAMES.filter(g => filter === 'All' || g.tags.includes(filter));
      $grid.innerHTML = list.map(g => `<a class="game" href="${g.href}">
        <div class="art" style="background:${g.bg}"><span class="emo">${g.emoji}</span>${g.badge ? `<span class="badge">${g.badge}</span>` : ''}</div>
        <div class="body"><h2>${g.title}</h2><p>${g.text}</p><div class="meta">${metaFor(g)}</div></div></a>`).join('') || '<p class="empty">No games here yet.</p>';
    }
    const $filters = document.getElementById('filters'), $grid = document.getElementById('grid');
    $filters.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { filter = b.dataset.t; render(); } });
    render();
  </script>
</body>
</html>

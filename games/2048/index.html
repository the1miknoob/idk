<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>2048 · Mikaeel</title>
  <meta name="description" content="Slide and merge number tiles to reach 2048">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔢</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared.css">
  <style>
    .game { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .stage { width: min(100%, 460px); aspect-ratio: 1; border-radius: 14px; }
    .grid {
      position: absolute; inset: 0; background: #bbada0; border-radius: 14px; padding: var(--gap); touch-action: none;
      display: grid; grid-template-columns: repeat(var(--n), 1fr); grid-template-rows: repeat(var(--n), 1fr); gap: var(--gap);
    }
    :root[data-theme="dark"] .grid { background: #3a3542; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .grid { background: #3a3542; } }
    .slot { background: rgba(238, 228, 218, .35); border-radius: 8px; }
    .tiles { position: absolute; inset: var(--gap); pointer-events: none; }
    .tile {
      position: absolute; width: var(--size); height: var(--size); border-radius: 8px; display: grid; place-items: center;
      font-weight: 700; font-size: calc(var(--size) * .42); transition: transform .12s ease-in-out; color: #776e65; background: #eee4da;
      font-variant-numeric: tabular-nums;
    }
    .tile .in { width: 100%; height: 100%; display: grid; place-items: center; border-radius: 8px; background: inherit; }
    .tile.new .in { animation: appear .18s ease-out .08s backwards; }
    .tile.merged .in { animation: bump .2s ease-out .08s; }
    @keyframes appear { from { transform: scale(0); } to { transform: scale(1); } }
    @keyframes bump { 50% { transform: scale(1.18); } }
    .tile.d3 { font-size: calc(var(--size) * .36); } .tile.d4 { font-size: calc(var(--size) * .3); } .tile.d5 { font-size: calc(var(--size) * .24); }
    .v2 { background: #eee4da; } .v4 { background: #ede0c8; }
    .v8 { background: #f2b179; color: #fff; } .v16 { background: #f59563; color: #fff; } .v32 { background: #f67c5f; color: #fff; }
    .v64 { background: #f65e3b; color: #fff; } .v128 { background: #edcf72; color: #fff; box-shadow: 0 0 20px rgba(243,215,116,.35); }
    .v256 { background: #edcc61; color: #fff; box-shadow: 0 0 22px rgba(243,215,116,.45); } .v512 { background: #edc850; color: #fff; box-shadow: 0 0 24px rgba(243,215,116,.55); }
    .v1024 { background: #edc53f; color: #fff; box-shadow: 0 0 26px rgba(243,215,116,.65); } .v2048 { background: #edc22e; color: #fff; box-shadow: 0 0 30px rgba(243,215,116,.8); }
    .vbig { background: #3c3a32; color: #fff; }
  </style>
  <meta name="theme-color" content="#5b6cff">
  <meta property="og:title" content="2048 · Mikaeel">
  <meta property="og:description" content="Slide and merge number tiles to reach 2048">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://the1miknoob.github.io/idk/icon-512.png">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../../apple-touch-icon.png">
  <script src="../../site.js" defer></script>
</head>
<body>
  <div class="wrap">
    <nav class="g-nav">
      <a href="../">← All games</a>
      <div class="right">
        <button class="icon-btn" data-mute-toggle aria-label="Sound">🔊</button>
        <button class="icon-btn" data-theme-toggle aria-label="Light or dark">🌙</button>
      </div>
    </nav>
    <div class="g-title">
      <h1>🔢 2048</h1>
      <div class="hud">
        <div class="chip"><small>Score</small><b id="score">0</b></div>
        <div class="chip"><small>Best</small><b id="best">0</b></div>
      </div>
    </div>

    <div class="game">
      <div class="stage" id="stage">
        <div class="grid" id="grid"></div>
        <div class="tiles" id="tiles"></div>
        <div class="overlay" id="overlay"><div class="card" id="card"></div></div>
      </div>
      <div class="row">
        <div class="seg" id="sizes"><button data-n="4">4×4</button><button data-n="5">5×5</button><button data-n="6">6×6</button></div>
        <button class="btn" id="undo">↶ Undo</button>
        <button class="btn" id="restart">↻ New</button>
      </div>
      <p class="help">Use the <kbd>←</kbd> <kbd>↑</kbd> <kbd>→</kbd> <kbd>↓</kbd> keys or swipe. Tiles with the same number merge. Reach <b>2048</b>!</p>
    </div>
  </div>

  <script src="../shared.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    let n = GS.store.get('2048-size', 4);
    let tiles, score, idSeq, won, keepGoing, history, over;
    const bestKey = () => n === 4 ? '2048' : '2048-' + n;

    function layout() {
      const stage = $('stage').getBoundingClientRect().width;
      const gap = Math.max(6, Math.round(stage * 0.025));
      const size = (stage - gap * (n + 1)) / n;
      $('stage').style.setProperty('--gap', gap + 'px');
      $('stage').style.setProperty('--n', n);
      $('stage').style.setProperty('--size', size + 'px');
      $('grid').innerHTML = '<div class="slot"></div>'.repeat(n * n);
      return { gap, size };
    }

    function newGame() {
      tiles = []; score = 0; idSeq = 0; won = false; keepGoing = false; history = []; over = false;
      layout();
      addRandom(); addRandom();
      $('overlay').classList.remove('show');
      GS.played('2048');
      render(); save();
    }

    function addRandom() {
      const empty = [];
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (!tiles.some(t => t.r === r && t.c === c)) empty.push([r, c]);
      if (!empty.length) return;
      const [r, c] = empty[Math.floor(Math.random() * empty.length)];
      tiles.push({ id: idSeq++, r, c, v: Math.random() < 0.9 ? 2 : 4, isNew: true });
    }

    // Slide everything in one direction
    function move(dir) {
      if (over || (won && !keepGoing)) return;
      const vec = { left: [0, -1], right: [0, 1], up: [-1, 0], down: [1, 0] }[dir];
      const snapshot = { tiles: tiles.map(t => ({ ...t, isNew: false, merged: false })), score };
      const grid = Array.from({ length: n }, () => Array(n).fill(null));
      tiles = tiles.filter(t => !t.gone);
      tiles.forEach(t => { t.isNew = false; t.merged = false; grid[t.r][t.c] = t; });
      const order = [...Array(n).keys()];
      const rows = vec[0] === 1 ? order.slice().reverse() : order;
      const cols = vec[1] === 1 ? order.slice().reverse() : order;
      let moved = false, gained = 0;
      for (const r of rows) for (const c of cols) {
        const t = grid[r][c]; if (!t) continue;
        let nr = r, nc = c;
        while (true) {
          const tr = nr + vec[0], tc = nc + vec[1];
          if (tr < 0 || tr >= n || tc < 0 || tc >= n) break;
          const other = grid[tr][tc];
          if (!other) { nr = tr; nc = tc; continue; }
          if (other.v === t.v && !other.merged && !other.gone) {
            // merge into the other tile
            grid[r][c] = null;
            other.v *= 2; other.merged = true; gained += other.v;
            t.r = tr; t.c = tc; t.gone = true;
            moved = true;
            nr = null;
          }
          break;
        }
        if (nr === null) continue;
        if (nr !== r || nc !== c) { grid[r][c] = null; grid[nr][nc] = t; t.r = nr; t.c = nc; moved = true; }
      }
      if (!moved) return;
      history.push(snapshot); if (history.length > 20) history.shift();
      score += gained;
      if (gained) GS.tone(300 + Math.log2(gained) * 40, 0.08, 'sine', 0.15); else GS.sfx('click');
      addRandom();
      render();
      setTimeout(() => { tiles = tiles.filter(t => !t.gone); render(); check(); save(); }, 130);
    }

    function canMove() {
      if (tiles.filter(t => !t.gone).length < n * n) return true;
      const at = (r, c) => tiles.find(t => !t.gone && t.r === r && t.c === c);
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
        const v = at(r, c).v;
        if ((c + 1 < n && at(r, c + 1).v === v) || (r + 1 < n && at(r + 1, c).v === v)) return true;
      }
      return false;
    }

    function check() {
      const res = GS.best(bestKey(), score);
      $('best').textContent = Math.max(score, res.best || 0);
      if (!won && tiles.some(t => t.v >= 2048)) {
        won = true; GS.sfx('win'); GS.confetti(120);
        showCard('🎉 You made 2048!', 'Amazing! Keep going for an even bigger tile?', [['Keep going', () => { keepGoing = true; hideCard(); }, true], ['New game', newGame]]);
      } else if (!canMove()) {
        over = true; GS.sfx('lose');
        const biggest = Math.max(...tiles.map(t => t.v));
        showCard('Game over', `Biggest tile: ${biggest}`, [['Try again', newGame, true], ['Undo', undo]], res.isNew);
      }
    }

    function showCard(title, text, buttons, isNewBest) {
      $('card').innerHTML = `<h2>${title}</h2><p>${text}</p><div class="big">${score}</div>${isNewBest ? '<div class="new-best">🏆 New best!</div>' : ''}
        <div class="row" style="margin-top:14px">${buttons.map(([t, , p], i) => `<button class="btn ${p ? 'primary' : ''}" data-b="${i}">${t}</button>`).join('')}</div>`;
      $('card').querySelectorAll('[data-b]').forEach(b => b.onclick = buttons[+b.dataset.b][1]);
      $('overlay').classList.add('show');
    }
    const hideCard = () => $('overlay').classList.remove('show');

    function undo() {
      const h = history.pop(); if (!h) return;
      tiles = h.tiles; score = h.score; over = false; hideCard();
      render(); save();
    }

    function render() {
      const { gap, size } = { gap: parseFloat(getComputedStyle($('stage')).getPropertyValue('--gap')), size: parseFloat(getComputedStyle($('stage')).getPropertyValue('--size')) };
      const box = $('tiles');
      const seen = new Set();
      for (const t of tiles) {
        seen.add(String(t.id));
        let el = box.querySelector(`[data-id="${t.id}"]`);
        if (!el) { el = document.createElement('div'); el.dataset.id = t.id; el.innerHTML = '<div class="in"></div>'; box.appendChild(el); }
        const digits = String(t.v).length;
        el.className = `tile ${t.v > 2048 ? 'vbig' : 'v' + t.v} ${digits >= 3 ? 'd' + Math.min(digits, 5) : ''} ${t.isNew ? 'new' : ''} ${t.merged ? 'merged' : ''}`;
        el.style.transform = `translate(${t.c * (size + gap)}px, ${t.r * (size + gap)}px)`;
        el.style.zIndex = t.gone ? 1 : 2;
        el.firstChild.textContent = t.v;
      }
      box.querySelectorAll('.tile').forEach(el => { if (!seen.has(el.dataset.id)) el.remove(); });
      $('score').textContent = score;
      $('best').textContent = Math.max(score, GS.best(bestKey()) || 0);
      $('undo').disabled = !history.length;
      document.querySelectorAll('#sizes button').forEach(b => b.classList.toggle('on', +b.dataset.n === n));
    }

    function save() { GS.store.set('2048-state', { n, tiles: tiles.filter(t => !t.gone).map(({ r, c, v }) => ({ r, c, v })), score, won, keepGoing, over }); }

    addEventListener('keydown', e => {
      const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down' };
      if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
    });
    GS.onSwipe($('stage'), move);
    $('undo').addEventListener('click', undo);
    $('restart').addEventListener('click', () => { if (over || score === 0 || confirm('Start a new game?')) newGame(); });
    $('sizes').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      n = +b.dataset.n; GS.store.set('2048-size', n); newGame();
    });
    addEventListener('resize', () => { layout(); render(); });

    const saved = GS.store.get('2048-state', null);
    if (saved && saved.n === n && saved.tiles && saved.tiles.length && !saved.over) {
      layout();
      idSeq = 0; tiles = saved.tiles.map(t => ({ ...t, id: idSeq++ })); score = saved.score; won = saved.won; keepGoing = saved.keepGoing; history = []; over = false;
      render();
    } else newGame();
  </script>
</body>
</html>

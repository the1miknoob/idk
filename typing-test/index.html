<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Test · Mikaeel</title>
  <meta name="description" content="How fast can you type? Test your words per minute and accuracy.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⌨️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../games/shared.css">
  <style>
    .bar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 6px 0 22px; }
    .live { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; min-height: 40px; }
    .live .big { font-size: 34px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
    .live .small { color: var(--muted); font-variant-numeric: tabular-nums; }
    .typebox { position: relative; cursor: text; }
    .words {
      font-family: "JetBrains Mono", monospace; font-size: clamp(20px, 3.6vw, 27px); line-height: 1.7; color: var(--muted);
      height: calc(1.7em * 3); overflow: hidden; display: flex; flex-wrap: wrap; gap: 0 .6em; user-select: none; position: relative;
    }
    .words.blur { filter: blur(5px); opacity: .6; }
    .word { position: relative; }
    .word.wrong { text-decoration: underline wavy var(--bad); text-underline-offset: 6px; }
    .l.ok { color: var(--text); }
    .l.bad { color: var(--bad); }
    .l.extra { color: #b32d31; opacity: .8; }
    .caret {
      position: absolute; width: 3px; height: 1.25em; background: var(--accent); border-radius: 2px; transition: left .08s, top .08s;
      animation: blink 1s steps(1) infinite;
    }
    .typing .caret { animation: none; }
    @keyframes blink { 50% { opacity: 0; } }
    #input { position: absolute; opacity: 0; left: 0; top: 0; width: 1px; height: 1px; }
    .focus-hint { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 500; color: var(--text); pointer-events: none; }
    .focus-hint[hidden] { display: none; }
    .results { display: none; }
    .results.show { display: block; }
    .res-top { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; }
    .res-big div { margin-bottom: 8px; }
    .res-big small { display: block; color: var(--muted); font-size: 14px; }
    .res-big b { font-size: 52px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
    .res-big .acc b { font-size: 36px; }
    svg.chart { width: 100%; height: 160px; }
    .res-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin: 16px 0; }
    .res-grid div { background: var(--surface-2); border-radius: 12px; padding: 8px 12px; }
    .res-grid small { display: block; color: var(--muted); font-size: 12px; }
    .res-grid b { font-size: 20px; font-variant-numeric: tabular-nums; }
    @media (max-width: 560px) { .res-top { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap wide" style="max-width:900px">
    <nav class="g-nav">
      <a href="../">← Back to Mikaeel's site</a>
      <div class="right">
        <button class="icon-btn" data-mute-toggle aria-label="Sound">🔊</button>
        <button class="icon-btn" data-theme-toggle aria-label="Light or dark">🌙</button>
      </div>
    </nav>
    <div class="g-title"><h1>⌨️ Typing Test</h1><div class="hud"><div class="chip"><small>Best</small><b id="pb">–</b></div></div></div>

    <div class="bar">
      <div class="seg" id="mode"><button data-v="time">⏱ Time</button><button data-v="words">🔤 Words</button></div>
      <div class="seg" id="amount"></div>
      <div class="seg" id="extras"><button data-v="punct">, . Punctuation</button><button data-v="numbers"># Numbers</button></div>
    </div>

    <section id="test">
      <div class="live"><span class="big" id="counter">30</span><span class="small" id="livewpm"></span></div>
      <div class="typebox" id="typebox">
        <div class="words" id="words"></div>
        <div class="caret" id="caret"></div>
        <div class="focus-hint" id="focus-hint" hidden>👆 Click here or press any key to focus</div>
        <input id="input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type here">
      </div>
      <p class="help">Start typing to begin. <kbd>Tab</kbd> + <kbd>Enter</kbd> or <kbd>Esc</kbd> restarts. Press <kbd>Space</kbd> to move to the next word.</p>
    </section>

    <section class="results panel" id="results">
      <div class="res-top">
        <div class="res-big"><div><small>wpm</small><b id="r-wpm">0</b></div><div class="acc"><small>accuracy</small><b id="r-acc">0%</b></div></div>
        <svg class="chart" id="chart" viewBox="0 0 600 160" preserveAspectRatio="none" aria-label="Speed over time"></svg>
      </div>
      <div class="res-grid">
        <div><small>Test</small><b id="r-type"></b></div>
        <div><small>Raw wpm</small><b id="r-raw"></b></div>
        <div><small>Characters</small><b id="r-chars" title="correct / wrong / extra / missed"></b></div>
        <div><small>Consistency</small><b id="r-cons"></b></div>
        <div><small>Time</small><b id="r-time"></b></div>
      </div>
      <p id="r-msg" style="text-align:center;font-weight:500"></p>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn primary" id="again">↻ Try again</button><button class="btn" id="same">Same words</button></div>
    </section>
  </div>

  <script src="../games/shared.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    // 200 of the most common English words
    const WORDS = ('the be to of and a in that have it for not on with he as you do at this but his by from they we say her she or an will my one all ' +
      'would there their what so up out if about who get which go me when make can like time no just him know take people into year your good some ' +
      'could them see other than then now look only come its over think also back after use two how our work first well way even new want because ' +
      'any these give day most us is was are been has had were said did get made find where thing still great every between long own world might ' +
      'place never around small large home hand high keep last school play run move live under old right tell before turn start show again need feel ' +
      'try leave call ask should help same big each few begin seem while those always both open write number problem part point head light house ' +
      'change water room story young fact month lot book eye job word business side kind family night game city music friend week car power money ' +
      'group line end program learn walk study together through follow read plan food carry early near fast build stand paper city').split(' ');
    const PUNCT = [',', '.', '!', '?', ';', ':'];
    let opts = { mode: 'time', time: 30, words: 25, punct: false, numbers: false, ...GS.store.get('typing-opts', {}) };
    let words = [], typed = [], wi = 0, started = 0, timerId = null, finished = false, keystrokes = 0, correctKeys = 0, samples = [], lastWords = null;

    function makeWords(n) {
      const out = [];
      for (let i = 0; i < n; i++) {
        let w = WORDS[Math.floor(Math.random() * WORDS.length)];
        if (opts.numbers && Math.random() < 0.12) w = String(Math.floor(Math.random() * 1000));
        if (opts.punct) {
          if (i === 0 || /[.!?]$/.test(out[i - 1] || '')) w = w[0].toUpperCase() + w.slice(1);
          if (Math.random() < 0.18) w += PUNCT[Math.floor(Math.random() * PUNCT.length)];
        }
        out.push(w);
      }
      if (opts.punct && !/[.!?]$/.test(out[n - 1])) out[n - 1] += '.';
      return out;
    }

    function reset(same = false) {
      clearInterval(timerId); timerId = null;
      words = same && lastWords ? lastWords.slice() : makeWords(opts.mode === 'time' ? 120 : opts.words);
      lastWords = words.slice();
      typed = ['']; wi = 0; started = 0; finished = false; keystrokes = 0; correctKeys = 0; samples = [];
      $('results').classList.remove('show'); $('test').hidden = false;
      $('counter').textContent = opts.mode === 'time' ? opts.time : `0/${opts.words}`;
      $('livewpm').textContent = '';
      $('input').value = '';
      renderWords(); focus();
      renderOpts();
    }

    // ---------- Rendering ----------
    function renderWords() {
      const box = $('words');
      box.innerHTML = words.map((w, i) => {
        const t = typed[i] ?? '';
        let html = '';
        for (let k = 0; k < Math.max(w.length, t.length); k++) {
          const ch = k < w.length ? w[k] : t[k];
          const cls = k >= t.length ? '' : k >= w.length ? 'extra' : t[k] === w[k] ? 'ok' : 'bad';
          html += `<span class="l ${cls}">${ch.replace('<', '&lt;')}</span>`;
        }
        const wrong = i < wi && t !== w;
        return `<span class="word ${wrong ? 'wrong' : ''}" data-i="${i}">${html}</span>`;
      }).join('');
      placeCaret();
    }
    function placeCaret() {
      const box = $('words'), wordEl = box.children[wi];
      if (!wordEl) return;
      const t = typed[wi] || '';
      const letters = wordEl.children;
      let x, y;
      const base = box.getBoundingClientRect();
      if (t.length < letters.length && letters[t.length]) { const r = letters[t.length].getBoundingClientRect(); x = r.left; y = r.top; }
      else { const r = (letters[letters.length - 1] || wordEl).getBoundingClientRect(); x = r.right; y = r.top; }
      // scroll so the current line is the 2nd visible line
      const lineH = parseFloat(getComputedStyle(box).lineHeight);
      const wordTop = wordEl.offsetTop;
      if (wordTop > lineH * 1.5) {
        // remove finished lines from the top
        const firstLineTop = box.children[0].offsetTop;
        let removeUntil = 0;
        for (let i = 0; i < box.children.length; i++) if (box.children[i].offsetTop === firstLineTop) removeUntil = i; else break;
        if (wordTop > firstLineTop + lineH * 1.5) {
          const n = removeUntil + 1;
          allDone.words.push(...words.slice(0, n)); allDone.typed.push(...typed.slice(0, n));   // keep them for the score
          words.splice(0, n); typed.splice(0, n); wi -= n;
          doneOffset += n;
          return renderWords();
        }
      }
      $('caret').style.left = (x - base.left) + 'px';
      $('caret').style.top = (y - base.top + lineH * 0.12) + 'px';
    }
    let doneOffset = 0;   // words already scrolled away (still count for stats)
    const allDone = { words: [], typed: [] };

    // ---------- Typing ----------
    function focus() { $('input').focus({ preventScroll: true }); $('focus-hint').hidden = true; $('words').classList.remove('blur'); }
    $('typebox').addEventListener('click', focus);
    $('input').addEventListener('blur', () => { if (!finished) setTimeout(() => { if (document.activeElement !== $('input')) { $('focus-hint').hidden = false; $('words').classList.add('blur'); } }, 150); });

    $('input').addEventListener('keydown', e => {
      if (finished) return;
      if (e.key === 'Tab') { e.preventDefault(); tabPressed = true; return; }
      if (e.key === 'Enter' && tabPressed) { e.preventDefault(); return restart(); }
      if (e.key === 'Escape') { e.preventDefault(); return restart(); }
      tabPressed = false;
      if (e.key === 'Backspace') {
        e.preventDefault();
        if (typed[wi].length) typed[wi] = e.ctrlKey || e.altKey ? '' : typed[wi].slice(0, -1);
        else if (wi > 0 && typed[wi - 1] !== words[wi - 1]) { wi--; }   // go back only to fix a wrong word
        renderWords(); return;
      }
      if (e.key === ' ') {
        e.preventDefault();
        if (!typed[wi].length) return;
        keystrokes++;
        if (typed[wi] === words[wi]) correctKeys++;
        wi++; typed[wi] = typed[wi] || '';
        GS.sfx('click');
        if (opts.mode === 'words' && wi + doneOffset >= opts.words) return finish();
        if (opts.mode === 'words') $('counter').textContent = `${wi + doneOffset}/${opts.words}`;
        if (opts.mode === 'time' && words.length - wi < 40) { const more = makeWords(60); words.push(...more); }
        renderWords(); return;
      }
      if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
        e.preventDefault();
        if (!started) begin();
        if (typed[wi].length >= words[wi].length + 8) return;
        const k = typed[wi].length;
        keystrokes++;
        if (words[wi][k] === e.key) correctKeys++;
        typed[wi] += e.key;
        document.body.classList.add('typing');
        renderWords();
        if (opts.mode === 'words' && wi + doneOffset === opts.words - 1 && typed[wi] === words[wi]) finish();
      }
    });
    // phones: some keyboards only send "input" events
    $('input').addEventListener('input', e => {
      const v = $('input').value; $('input').value = '';
      for (const ch of v) $('input').dispatchEvent(new KeyboardEvent('keydown', { key: ch }));
    });
    let tabPressed = false;
    addEventListener('keydown', e => {
      if (document.activeElement === $('input') || e.ctrlKey || e.metaKey) return;
      if (e.key === 'Escape' || (e.key === 'Enter' && $('results').classList.contains('show'))) { e.preventDefault(); restart(); return; }
      if (!finished && e.key.length === 1) focus();
    });

    function begin() {
      started = performance.now();
      const statsSoFar = () => stats((performance.now() - started) / 1000);
      timerId = setInterval(() => {
        const secs = (performance.now() - started) / 1000;
        const s = statsSoFar();
        samples.push({ t: Math.round(secs), wpm: s.wpm, raw: s.raw });
        $('livewpm').textContent = `${Math.round(s.wpm)} wpm`;
        if (opts.mode === 'time') {
          const left = Math.max(0, Math.ceil(opts.time - secs));
          $('counter').textContent = left;
          if (secs >= opts.time) finish();
        }
      }, 1000);
    }

    // Words per minute = correct characters (incl. the space after each correct word) ÷ 5 per minute
    function stats(secs) {
      const W = [...allDone.words, ...words.slice(0, wi + 1)], T = [...allDone.typed, ...typed.slice(0, wi + 1)];
      let correct = 0, wrong = 0, extra = 0, missed = 0, all = 0;
      T.forEach((t, i) => {
        const w = W[i] || '';
        const isLast = i === T.length - 1;
        for (let k = 0; k < Math.max(w.length, t.length); k++) {
          if (k >= t.length) { if (!isLast) missed++; }
          else if (k >= w.length) extra++;
          else if (t[k] === w[k]) correct++; else wrong++;
        }
        all += t.length + (isLast ? 0 : 1);
        if (!isLast && t === w) correct++;          // the space
        if (isLast && t === w && finished) correct++;
      });
      const min = Math.max(secs, 1) / 60;
      return { wpm: correct / 5 / min, raw: all / 5 / min, correct, wrong, extra, missed };
    }

    function finish() {
      if (finished) return;
      finished = true; clearInterval(timerId);
      document.body.classList.remove('typing');
      const secs = opts.mode === 'time' ? opts.time : (performance.now() - started) / 1000;
      const s = stats(secs);
      const acc = keystrokes ? correctKeys / keystrokes * 100 : 0;
      const w = Math.round(s.wpm);
      $('r-wpm').textContent = w;
      $('r-acc').textContent = Math.round(acc) + '%';
      $('r-raw').textContent = Math.round(s.raw);
      $('r-chars').textContent = `${s.correct}/${s.wrong}/${s.extra}/${s.missed}`;
      $('r-time').textContent = Math.round(secs) + 's';
      $('r-type').textContent = opts.mode === 'time' ? `${opts.time} seconds` : `${opts.words} words`;
      const wpms = samples.map(x => x.raw);
      const mean = wpms.reduce((a, b) => a + b, 0) / (wpms.length || 1);
      const sd = Math.sqrt(wpms.reduce((a, b) => a + (b - mean) ** 2, 0) / (wpms.length || 1));
      $('r-cons').textContent = wpms.length > 1 ? Math.max(0, Math.round(100 - sd / (mean || 1) * 100)) + '%' : '–';
      drawChart();
      const key = `typing-${opts.mode}-${opts.mode === 'time' ? opts.time : opts.words}${opts.punct ? '-p' : ''}${opts.numbers ? '-n' : ''}`;
      const res = acc >= 75 ? GS.best(key, w) : { isNew: false, best: GS.best(key) };
      if (acc >= 75 && !(opts.punct || opts.numbers) && opts.mode === 'time' && opts.time === 30) GS.best('typing', w);
      $('r-msg').textContent = res.isNew ? `🏆 New personal best for this test!` : acc < 75 ? 'Accuracy under 75% doesn\'t count for a best score. Slow down a bit!' :
        w >= 80 ? '🔥 Blazing fast!' : w >= 60 ? '⚡ Great speed!' : w >= 40 ? '👍 Nice typing!' : '🙂 Keep practicing, you\'ll get faster!';
      if (res.isNew) GS.confetti();
      GS.sfx(res.isNew ? 'win' : 'pop');
      $('test').hidden = true; $('results').classList.add('show');
      renderOpts();
    }

    function drawChart() {
      const pts = samples.length ? samples : [{ t: 0, wpm: 0, raw: 0 }];
      const maxT = Math.max(1, pts[pts.length - 1].t), maxW = Math.max(20, ...pts.map(p => Math.max(p.wpm, p.raw))) * 1.15;
      const X = t => t / maxT * 580 + 10, Y = w => 150 - w / maxW * 140;
      const path = k => pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)},${Y(p[k]).toFixed(1)}`).join('');
      let grid = '';
      const step = Math.max(10, Math.ceil(maxW / 5 / 10) * 10);   // about 5 grid lines
      for (let w = step; w < maxW; w += step) grid += `<line x1="10" x2="590" y1="${Y(w)}" y2="${Y(w)}" stroke="var(--border)"/><text x="12" y="${Y(w) - 3}" font-size="10" fill="var(--muted)">${w}</text>`;
      $('chart').innerHTML = grid + `<path d="${path('raw')}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
        <path d="${path('wpm')}" fill="none" stroke="var(--accent)" stroke-width="3" vector-effect="non-scaling-stroke"/>`;
    }

    // ---------- Options ----------
    function renderOpts() {
      document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('on', b.dataset.v === opts.mode));
      const amounts = opts.mode === 'time' ? [15, 30, 60, 120] : [10, 25, 50, 100];
      const cur = opts.mode === 'time' ? opts.time : opts.words;
      $('amount').innerHTML = amounts.map(a => `<button data-v="${a}" class="${a === cur ? 'on' : ''}">${a}${opts.mode === 'time' ? 's' : ''}</button>`).join('');
      document.querySelectorAll('#extras button').forEach(b => b.classList.toggle('on', !!opts[b.dataset.v]));
      const key = `typing-${opts.mode}-${cur}${opts.punct ? '-p' : ''}${opts.numbers ? '-n' : ''}`;
      const pb = GS.best(key);
      $('pb').textContent = pb ? pb + ' wpm' : '–';
    }
    const saveOpts = () => GS.store.set('typing-opts', opts);
    $('mode').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { opts.mode = b.dataset.v; saveOpts(); restart(); } });
    $('amount').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { opts[opts.mode] = +b.dataset.v; saveOpts(); restart(); } });
    $('extras').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { opts[b.dataset.v] = !opts[b.dataset.v]; saveOpts(); restart(); } });
    function restart(same = false) { doneOffset = 0; allDone.words = []; allDone.typed = []; reset(same); }
    $('again').addEventListener('click', () => restart());
    $('same').addEventListener('click', () => restart(true));

    addEventListener('resize', () => { if (!finished) renderWords(); });

    GS.played('typing');
    restart();
  </script>
</body>
</html>
